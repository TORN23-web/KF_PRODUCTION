name: Build KF Production for iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-cloud/**"
      - ".github/workflows/build-kf-production-ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS app on macOS
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios-cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Apply KF Production app icon
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = Path("AppIcon-1024.png.base64").read_text().strip()
          icon = base64.b64decode(encoded, validate=True)
          Path("ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png").write_bytes(icon)
          PY
          cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-512@2x.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Install CocoaPods
        working-directory: ios-cloud/ios/App
        run: pod install

      - name: Build unsigned iOS Simulator app
        working-directory: ios-cloud
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator build
        run: |
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/KF-Production-iOS-Simulator.zip" App.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: KF-Production-iOS-Simulator
          path: KF-Production-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
