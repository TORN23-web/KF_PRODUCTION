# Manual-only legacy deployment entry point.
# Automatic production deployment is handled by deploy-pages.yml.
name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public website files only
        run: |
          mkdir -p _site _site/assets _site/films _site/legacy
          cp ./*.html ./*.css ./*.js _site/
          cp -R assets/. _site/assets/
          cp -R films/. _site/films/
          cp -R legacy/. _site/legacy/
          touch _site/.nojekyll
          rm -f _site/server.js _site/.env _site/.env.*
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
