name: Deploy KF Production to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp ./*.html ./*.css ./*.js _site/
          mkdir -p _site/assets _site/films
          if [ -d assets ]; then cp -R assets/. _site/assets/; fi
          if [ -d films ]; then cp -R films/. _site/films/; fi
          touch _site/.nojekyll
          rm -f _site/server.js _site/.env _site/.env.*

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
